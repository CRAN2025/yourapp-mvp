name: UI smoke tests

on:
  push:
    branches: [ main, feat/**, fix/** ]
  pull_request:

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build client (Vite)
        run: npx vite build --outDir dist/public --emptyOutDir

      - name: Start preview server
        run: |
          nohup npx vite preview --outDir dist/public --host 127.0.0.1 --port 5173 --strictPort >/dev/null 2>&1 &
          npx -y wait-on http://127.0.0.1:5173

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run smoke tests
        env:
          BASE_URL: http://127.0.0.1:5173
        run: npx playwright test tests/smoke.visual.spec.ts tests/auth-signup-mode.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
